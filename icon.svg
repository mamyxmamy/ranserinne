  <g>
    <rect x="392" y="392" width="76" height="76" rx="10" fill="#a31616"/>
    <text x="430" y="452" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="52" font-weight="bold" fill="#f7ead2" text-anchor="middle">輪</text>
  </g>
